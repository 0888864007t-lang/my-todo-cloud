<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Việc cần làm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#faf9f8;--side:#ffffff;--card:#ffffff;--ink:#323130;--mute:#605e5c;--line:#e1dfdd;--top:#2564cf;--top2:#1b4fae;--topink:#ffffff;--accent:#2564cf;--on:#ffffff;--sel:#eff6fc;--hover:#f3f2f1;--warn:#a4262c;--shadow:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--side:#252423;--card:#252423;--ink:#f3f2f1;--mute:#c8c6c4;--line:#3b3a39;--top:#1f3f87;--top2:#16316b;--accent:#5b9bff;--on:#0b1220;--sel:#2b3a55;--hover:#323130;--warn:#f1707b;--shadow:none}}
:root[data-theme="dark"]{--bg:#1b1a19;--side:#252423;--card:#252423;--ink:#f3f2f1;--mute:#c8c6c4;--line:#3b3a39;--top:#1f3f87;--top2:#16316b;--accent:#5b9bff;--on:#0b1220;--sel:#2b3a55;--hover:#323130;--warn:#f1707b;--shadow:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Be Vietnam Pro","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;border-radius:4px;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{display:inline-flex;flex:none}
.hide{display:none!important}
.sub{color:var(--mute);font-size:12px}
.late{color:var(--warn);font-weight:600}
.go{background:var(--accent);color:var(--on);font-weight:600;padding:7px 18px;border-radius:4px}
.go:hover{filter:brightness(1.08)}
.go:disabled{opacity:.6}
.top{position:relative;z-index:7;flex:none;height:48px;background:var(--top);color:var(--topink);display:flex;align-items:center;gap:2px;padding-right:10px}
.waffle{width:48px;height:48px;background:var(--top2);color:#fff;display:grid;place-items:center;border-radius:0;flex:none}
.waffle:hover{filter:brightness(1.15)}
.brand{font-size:17px;font-weight:700;letter-spacing:.6px;margin:0 16px 0 10px;white-space:nowrap}
.search{position:relative;flex:0 1 500px;margin:0 auto}
.search input{width:100%;height:32px;border:0;border-radius:4px;background:#fff;color:#323130;padding:0 12px 0 38px}
.search input::placeholder{color:#605e5c}
.si{position:absolute;left:10px;top:7px;color:#2564cf;pointer-events:none}
#sync{font-size:12px;opacity:.85;margin:0 8px;white-space:nowrap}
.tbtn{width:40px;height:40px;display:grid;place-items:center;color:#fff;border-radius:4px}
.tbtn:hover{background:rgba(255,255,255,.16)}
.top .av{width:34px;height:34px;margin-left:6px;padding:0;border-radius:50%;background:#fff;overflow:hidden;display:block;line-height:0;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.top .av svg{width:100%;height:100%;display:block}
.top .av:hover{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(255,255,255,.35)}
.app{flex:1;display:flex;min-height:0;position:relative}
nav{width:290px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:6px 0;overflow:auto}
nav .item{display:flex;align-items:center;gap:16px;width:100%;height:42px;padding:0 16px;border-radius:0;text-align:left;color:var(--ink)}
nav .item:hover{background:var(--hover)}
nav .item.on{background:var(--sel);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav .navburger{margin-bottom:6px}
nav .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .n{color:var(--mute);font-size:12px;font-weight:400}
nav hr{border:0;border-top:1px solid var(--line);margin:8px 16px}
nav .new,nav .new .n{color:var(--accent)}
nav .new .n{display:inline-flex}
@media (min-width:761px){.collapsed nav{width:56px}.collapsed nav .lab,.collapsed nav .n{display:none}}
main{flex:1;min-width:0;overflow:auto;padding:20px 28px 40px}
.head{display:flex;align-items:flex-start;gap:8px 24px;flex-wrap:wrap}
.tcol{min-width:0}
.trow{display:flex;align-items:center;gap:10px;height:36px;color:var(--accent)}
#sub{font-size:13px;margin-top:2px}
h1{margin:0;font-size:21px;font-weight:600;line-height:1.2;color:var(--accent)}
h2{font-weight:600}
.dots{width:32px;height:32px;display:grid;place-items:center;color:var(--mute)}
.dots:hover{background:var(--hover)}
.tabs button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;color:var(--accent);border-bottom:2px solid transparent;border-radius:0}
.tabs button:hover{background:var(--hover)}
.tabs button.on{border-bottom-color:var(--accent);font-weight:600}
.sp{flex:1}
.opts{display:flex;align-items:center;gap:2px;position:relative;flex-wrap:wrap;margin-left:auto}
.opts>button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;color:var(--accent)}
.opts>button:hover{background:var(--hover)}
.chips{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:12px 0 6px;font-size:12px;font-weight:600;min-height:24px}
.chip2{display:inline-flex;align-items:center;gap:4px}
.chips .x{width:22px;height:22px;display:grid;place-items:center;color:var(--accent)}
.pop{position:absolute;right:0;top:40px;z-index:8;min-width:220px;color:var(--ink);max-width:320px;background:var(--card);border-radius:4px;box-shadow:0 6.4px 14.4px rgba(0,0,0,.18),0 1.2px 3.6px rgba(0,0,0,.14);padding:6px 0}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 14px;border-radius:0}
.pop button:hover{background:var(--hover)}
.pop .sub{padding:4px 14px}
.pop .ck{width:16px;display:inline-flex}
#set{right:12px;top:52px;width:290px;padding:12px}
#set .sub{padding:4px 0}
#set button{padding:8px 6px}
.pop input,.pop select{padding:7px 8px;margin:4px 0;width:100%;background:var(--card);border:1px solid #8a8886;border-radius:4px;color:var(--ink)}
.tip{background:var(--accent);color:var(--on);border-radius:4px;padding:14px 16px;width:300px;margin:8px 0;box-shadow:var(--shadow)}
.tip button{border:1px solid var(--on);padding:4px 18px;margin-top:10px;color:var(--on)}
form.add{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:4px;box-shadow:var(--shadow);padding:0 14px;min-height:52px;margin:8px 0 18px}
form.add .pl{color:var(--accent)}
form.add #text{flex:1;border:0;background:none;font-size:14px;padding:14px 0;min-width:0}
form.add #text::placeholder{color:var(--accent)}
form.add #text:focus{outline:none}
.addr{display:none;align-items:center;gap:8px}
form.add:focus-within .addr{display:flex}
.addr input[type=date]{background:var(--hover);border:0;border-radius:4px;padding:5px 8px}
.gt{font-weight:600;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.list{display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:4px;box-shadow:var(--shadow);padding:10px 8px 10px 14px;min-height:52px}
.task.done .tt{text-decoration:line-through;color:var(--mute)}
.tb{flex:1;min-width:0}
.tt{overflow-wrap:break-word;line-height:1.45}
.note{font-size:12px;color:var(--mute);white-space:pre-wrap;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12px;color:var(--mute)}
.meta>*+*::before{content:"·";margin-right:6px}
.meta .mi{display:inline-flex;align-items:center;gap:4px}
.task .s,.acts button{width:30px;height:30px;display:grid;place-items:center;color:var(--mute)}
.task .s:hover,.acts button:hover{background:var(--hover);color:var(--ink)}
.task .s.on,.acts .on{color:var(--accent)}
.acts{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .12s}
.task:hover .acts,.task:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.list .task .acts{order:2}.list .task .s{order:3}
.grid .task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"chk body star" "acts acts acts";gap:2px 12px;align-items:start;padding:12px 8px 6px 14px}
.grid .task>input{grid-area:chk;margin-top:2px}.grid .task>.tb{grid-area:body}.grid .task>.s{grid-area:star}.grid .task>.acts{grid-area:acts;justify-content:flex-end}
input[type=checkbox]{appearance:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink);flex:none;display:grid;place-items:center;cursor:pointer;background:none;margin:0;opacity:.8}
input[type=checkbox]:hover{border-color:var(--accent);opacity:1}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);opacity:1}
input[type=checkbox]:checked::after{content:"";width:4px;height:8px;border:solid var(--on);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty{color:var(--mute);text-align:center;padding:48px 12px}
.calhead{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.calhead b{flex:1;text-transform:capitalize;font-size:24px;font-weight:700}
.calhead button{border:1px solid var(--line);background:var(--card);padding:8px 18px;font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;color:var(--mute);font-size:15px;font-weight:700;padding:8px 0}
.day{min-height:clamp(110px,16vh,170px);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;transition:box-shadow .15s,transform .15s;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day.blank{background:none;border:0;cursor:default}
.day:not(.blank):hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.day.today .dn{background:var(--accent);color:var(--on);border-radius:99px;padding:2px 10px}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.dn{font-size:16px;font-weight:700;align-self:flex-start;margin-bottom:2px}
.chip{font-size:13px;background:var(--sel);color:var(--accent);border-radius:4px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.done{text-decoration:line-through;color:var(--mute)}
.more,.dot{font-size:13px;color:var(--mute)}.dot{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:30;padding:16px}
#auth{display:none;position:fixed;inset:0;place-items:center;background:var(--bg);padding:16px;z-index:20}
.out #auth{display:grid}.out .top,.out .app{display:none}
.acard{width:min(400px,100%);background:var(--card);border-radius:8px;padding:24px;box-shadow:0 12.8px 28.8px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:12px}
.acard.wide{width:min(560px,100%);max-height:92vh;overflow:auto}
.acard h2{margin:0;font-size:20px}
.acard{padding:32px 28px 28px;gap:14px}
.abrand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:4px;text-align:center}
.alogo{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--on);display:grid;place-items:center}
.abrand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.8px;color:var(--ink);line-height:1.2}
#asubtxt{text-align:center}
.acard .linkbtn{align-self:center}
.acard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.acard input,.acard textarea{background:var(--card);border:1px solid #8a8886;border-radius:4px;padding:8px 10px;font-size:14px;color:var(--ink)}
.acard textarea{min-height:100px;resize:vertical}
.acard input:focus,.acard textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.acard .go{padding:9px}
.acard .tabs{display:flex}.acard .tabs button{flex:1;justify-content:center}
#aerr{color:var(--warn);font-weight:600;min-height:1.2em;font-size:13px}
#aerr.ok{color:var(--accent)}
.alang{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));color:var(--accent);padding:6px 10px}
.linkbtn{color:var(--accent);padding:2px 0;align-self:flex-start;font-size:13px}
.row{display:flex;gap:8px}.row button{flex:1;padding:9px;border-radius:4px}
.ghost{border:1px solid #8a8886}
#aout{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.acard .aitem{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.aitem input[type=checkbox]{padding:0;width:20px;height:20px;flex:none}
.acard .aitem input.at{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px;background:none}
.acard .aitem input.at:hover,.acard .aitem input.at:focus{border-bottom-color:var(--accent);box-shadow:none}
.aitem .adate{width:auto;padding:4px 6px;font-size:12px;flex:none}
@media (max-width:760px){
 nav{position:absolute;inset:0 auto 0 0;z-index:6;transform:translateX(-100%);width:280px;transition:transform .2s}
 nav.open{transform:none;box-shadow:0 0 24px rgba(0,0,0,.3)}
 nav .navburger{display:none}
 main{padding:14px}.brand{display:none}.search{flex:1;margin:0 4px}#sync,#help{display:none}
 .day{min-height:54px;padding:4px}.dn{font-size:13px}.calgrid{gap:2px}.calhead b{font-size:18px}.dow{font-size:12px}.chip,.more{display:none}.dot{display:block}
 .head{gap:8px}.chips{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.selbar{display:flex;align-items:center;gap:4px;background:var(--sel);border-radius:4px;padding:6px 8px;margin:4px 0 10px;font-weight:600;position:sticky;top:-20px;z-index:3}
.selbar button{padding:6px 12px;color:var(--accent);font-weight:400}
.selbar button:hover{background:var(--hover)}
.selbar .danger{color:var(--on);background:var(--warn);font-weight:600}
.selbar .danger:hover{background:var(--warn);filter:brightness(1.1)}
.selbar .danger:disabled,.selbar button:disabled{opacity:.45;cursor:default}
.task.pick{cursor:pointer;display:flex;align-items:flex-start;gap:12px}
.grid .task.pick{display:flex}
.task.picked{box-shadow:inset 0 0 0 2px var(--accent)}
.sq{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:3px;flex:none;display:grid;place-items:center;margin-top:1px;opacity:.8}
.sq.on{background:var(--accent);border-color:var(--accent);color:var(--on);opacity:1}
.gtr{display:flex;align-items:center;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:16px;background:#323130;color:#fff;padding:10px 16px;border-radius:4px;box-shadow:0 6.4px 14.4px rgba(0,0,0,.3)}
.toast button{color:#8ab4ff;font-weight:600;padding:2px 6px}
</style>
</head>
<body>
<div id="auth">
  <button class="alang" id="alang"></button>
  <form class="acard" id="aform">
    <div class="abrand"><span class="alogo" data-i="check" data-s="26"></span><h1 id="abrand">QUẢN LÝ CÔNG VIỆC</h1></div>
    <p class="sub" id="asubtxt" style="margin:0">Dữ liệu được đồng bộ giữa các thiết bị của bạn.</p>
    <div class="tabs" id="tabs"><button type="button" id="tLogin">Đăng nhập</button><button type="button" id="tReg">Đăng ký</button></div>
    <label id="row0">Email<input id="au" type="email" autocomplete="email" required></label>
    <label id="row1">Mật khẩu<input id="ap" type="password" autocomplete="current-password" required></label>
    <label id="row2" class="hide">Nhập lại mật khẩu<input id="ap2" type="password" autocomplete="new-password"></label>
    <button type="button" class="linkbtn" id="forgot">Quên mật khẩu?</button><button type="button" class="linkbtn hide" id="back">← Quay lại đăng nhập</button>
    <div id="aerr" role="alert"></div>
    <button class="go" id="asub"></button>
  </form>
</div>
<div class="top">
  <button class="waffle" id="burger" aria-label="Menu"><span data-i="waffle"></span></button>
  <b class="brand" id="brand">QUẢN LÝ CÔNG VIỆC</b>
  <div class="search"><span class="si" data-i="search" data-s="18"></span><input id="q" type="search" placeholder="Tìm kiếm" aria-label="Tìm kiếm"></div>
  <span id="sync" title="Đồng bộ"></span>
  <button class="tbtn" id="theme" aria-label="Giao diện sáng/tối"><span data-i="theme"></span></button>
  <button class="tbtn" id="gear" aria-label="Cài đặt" title="Cài đặt"><span data-i="gear"></span></button>
  <button class="tbtn" id="help" aria-label="Trợ giúp" title="Trợ giúp"><span data-i="help"></span></button>
  <button class="av" id="av" aria-label="Tài khoản" title="Tài khoản">TN</button>
  <div class="pop" id="set" hidden>
    <div class="sub">Tài khoản</div><div id="who" style="font-weight:600;padding-bottom:6px"></div>
    <label class="sub" for="lang">Ngôn ngữ</label>
    <select id="lang"><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
    <div class="sub" style="margin-top:6px">Trợ lý (Ollama)</div>
    <input id="aiurl" placeholder="http://localhost:11434" aria-label="Ollama URL">
    <select id="aimodel" aria-label="Model"></select>
    <button id="aitest">Kiểm tra kết nối</button><div class="meta" id="aistat" style="padding:0 0 6px"></div>
    <button id="logout">Đăng xuất</button>
  </div>
</div>
<div class="app">
  <nav id="nav"></nav>
  <main>
    <div class="head">
      <div class="tcol"><div class="trow"><span id="ticon"></span><h1 id="title"></h1><button class="dots hide" id="more" aria-label="Xóa danh sách" title="Xóa danh sách"><span data-i="dots"></span></button></div><div class="sub" id="sub"></div></div>
      <div class="tabs"><button id="mGrid"><span data-i="grid" data-s="18"></span>Lưới</button><button id="mList"><span data-i="listv" data-s="18"></span>Danh sách</button></div>
      <div class="sp"></div>
      <div class="opts">
        <button id="selb"><span data-i="select" data-s="18"></span>Chọn</button>
        <button id="sortb"><span data-i="sort" data-s="18"></span>Sắp xếp</button>
        <button id="groupb"><span data-i="group" data-s="18"></span>Nhóm</button>
        <button id="aibtn"><span data-i="chat" data-s="18"></span>Trợ lý</button>
        <button id="sug"><span data-i="bulb" data-s="18"></span>Gợi ý</button>
        <div class="pop" id="pop" hidden></div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="selbar hide" id="selbar"><span id="selcount"></span><span class="sp"></span><button id="selall">Chọn tất cả</button><button id="selsame">Chọn cùng tên</button><button id="seldel" class="danger">Xóa</button><button id="selx">Xong</button></div>
    <div class="tip" id="tip" hidden>Thêm tác vụ mới hoặc chọn từ Gợi ý để lên kế hoạch cho ngày của bạn.<br><button id="tipOk">Tiếp theo</button></div>
    <form class="add" id="form">
      <span class="pl" data-i="plus"></span>
      <input type="text" id="text" placeholder="Thêm một tác vụ" autocomplete="off" aria-label="Thêm một tác vụ">
      <div class="addr"><input type="date" id="due" aria-label="Hạn chót"><button class="go">Thêm</button></div>
    </form>
    <div id="out"></div>
  </main>
</div>
<div class="toast hide" id="toast"><span id="tmsg"></span><button id="tundo">Hoàn tác</button></div>
<div class="modal hide" id="edit">
  <form class="acard" id="eform">
    <h2>Sửa tác vụ</h2>
    <label>Tiêu đề<input id="et" required maxlength="200" autocomplete="off"></label>
    <label>Ghi chú<textarea id="en" placeholder="Thêm ghi chú..."></textarea></label>
    <button type="button" class="linkbtn" id="ainote">Gợi ý ghi chú</button><button type="button" class="linkbtn" id="asplit">Chia nhỏ việc này</button>
    <label>Hạn chót<input id="ed" type="date"></label>
    <div class="row"><button type="button" class="ghost" id="ecancel">Hủy</button><button class="go">Lưu thay đổi</button></div>
  </form>

const setSync = s => { $("#sync").textContent = T({"☁️":"Đã lưu","⏳":"Đang lưu...","⚠️":"Lỗi đồng bộ"}[s]); };
async function load(){   // tải toàn bộ dữ liệu của tài khoản từ Supabase
  const [a, b] = await Promise.all([sb.from("tasks").select("*"), sb.from("lists").select("id,name")]);
  if (a.error || b.error){ console.error(a.error || b.error); return setSync("⚠️"); }
  tasks = a.data.map(r => ({ id:r.id, text:r.text, note:r.note || "", done:r.done, star:r.star, myday:r.myday, due:r.due || "", list:r.list, created:Number(r.created) }));
  lists = b.data; remote = snap(); setSync("☁️");
}
async function push(){   // chỉ gửi những dòng đã thay đổi hoặc bị xóa
  const cur = snap(), up = {tasks:[], lists:[]}, del = {tasks:[], lists:[]};
  tasks.forEach(t => { if (remote.get("t:" + t.id) !== cur.get("t:" + t.id)) up.tasks.push(rowT(t)); });
  lists.forEach(l => { if (remote.get("l:" + l.id) !== cur.get("l:" + l.id)) up.lists.push({id:l.id, name:l.name}); });
  for (const k of remote.keys()) if (!cur.has(k)) del[k[0] === "t" ? "tasks" : "lists"].push(k.slice(2));
  setSync("⏳");
  try {
    for (const tb of ["lists","tasks"]) if (up[tb].length){ const { error } = await sb.from(tb).upsert(up[tb]); if (error) throw error; }
    for (const tb of ["tasks","lists"]) if (del[tb].length){ const { error } = await sb.from(tb).delete().in("id", del[tb]); if (error) throw error; }
    remote = cur; setSync("☁️");
  } catch (e){ console.error(e); setSync("⚠️"); }
  pending = false;
}
function listen(){       // nhận thay đổi từ thiết bị khác theo thời gian thực
  if (ch) sb.removeChannel(ch);
  const refresh = () => { clearTimeout(refresh.t); refresh.t = setTimeout(async () => { if (pending) return; await load(); render(); }, 300); };
  ch = sb.channel("sync").on("postgres_changes", {event:"*", schema:"public", table:"tasks"}, refresh)
         .on("postgres_changes", {event:"*", schema:"public", table:"lists"}, refresh).subscribe();
}

// Avatar hiện đại, ngẫu nhiên nhưng cố định cho mỗi tài khoản (tạo từ email)
function avatarSvg(seed){
  let x = 2166136261; for (const c of seed) x = Math.imul(x ^ c.charCodeAt(0), 16777619) >>> 0;
  const rnd = () => (x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296;
  const hue = rnd() * 360, hsl = (h, l, s = 82) => "hsl(" + Math.round(h % 360) + "," + s + "%," + l + "%)";
  const id = "g" + (x % 1e6), shape = Math.floor(rnd() * 4);
  const c1 = hsl(hue, 58), c2 = hsl(hue + 40 + rnd() * 80, 52), c3 = hsl(hue + 160 + rnd() * 80, 68);
  let o = '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs><rect width="40" height="40" fill="url(#' + id + ')"/>';
  for (let i = 0; i < 3; i++){
    const cx = (rnd() * 40).toFixed(1), cy = (rnd() * 40).toFixed(1), r = (8 + rnd() * 12).toFixed(1), op = (.35 + rnd() * .4).toFixed(2), f = i % 2 ? c3 : "#fff";
    if (shape === 0) o += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + f + '" opacity="' + op + '"/>';
    else if (shape === 1) o += '<rect x="' + (cx - r / 2) + '" y="' + (cy - r / 2) + '" width="' + r + '" height="' + r + '" rx="' + (r / 3).toFixed(1) + '" transform="rotate(' + Math.round(rnd() * 90) + ' ' + cx + ' ' + cy + ')" fill="' + f + '" opacity="' + op + '"/>';
    else if (shape === 2) o += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + r + '" ry="' + (r / 2).toFixed(1) + '" transform="rotate(' + Math.round(rnd() * 180) + ' ' + cx + ' ' + cy + ')" fill="' + f + '" opacity="' + op + '"/>';
    else o += '<path d="M' + cx + ' ' + (cy - r) + ' L' + (+cx + r) + ' ' + (+cy + r / 2) + ' L' + (cx - r) + ' ' + (+cy + r / 2) + 'Z" fill="' + f + '" opacity="' + op + '"/>';
  }
  return o + '</svg>';
}

const DEF_URL = "http://localhost:11434", ERR_AI = "Không kết nối được AI. Hãy bật Ollama (ServBay), kiểm tra địa chỉ trong Cài đặt và cho phép origin của trang này (OLLAMA_ORIGINS).";

async function aiChat(content, system, onText, max = 450){
  const model = st.get("aimodel", "");
  if (!model) throw new Error(T("Chưa chọn model AI. Mở Cài đặt → Kiểm tra kết nối."));
  let r;
  try {
    r = await fetch(aiUrl() + "/api/chat", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ model, stream:true, keep_alive:"30m", options:{ temperature:0.3, num_predict:max }, messages:[{role:"system", content:system},{role:"user", content}] }) });
  } catch { throw new Error(T(ERR_AI)); }
  if (!r.ok) throw new Error("AI: HTTP " + r.status);
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "", full = "";
  for (;;){
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    let i; while ((i = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!line) continue;
      try { const j = JSON.parse(line); if (j.message && j.message.content){ full += j.message.content; if (onText) onText(full); } } catch {}
    }
  }
  return full;
}

    s.textContent = "✓ " + names.length + " model"; warmUp();
  } catch { s.textContent = T(ERR_AI); }
};

// ---- Lịch tháng ----
const pad = n => String(n).padStart(2, "0");
ui.cal = { y: new Date().getFullYear(), m: new Date().getMonth(), sel: today() };
function renderCal(){
  const { y, m, sel } = ui.cal, out = $("#out"), loc = lang === "en" ? "en-US" : "vi-VN";
  const go = d => () => { const dt = new Date(y, m + d, 1); ui.cal.y = dt.getFullYear(); ui.cal.m = dt.getMonth(); renderCal(); };
  out.replaceChildren(h("div", {class:"calhead"}, h("button", {onclick:go(-1), "aria-label":"‹"}, "‹"),
    h("b", {}, new Date(y, m, 1).toLocaleDateString(loc, {month:"long", year:"numeric"})), h("button", {onclick:go(1), "aria-label":"›"}, "›"),
    h("button", {onclick(){ const n = new Date(); ui.cal = { y:n.getFullYear(), m:n.getMonth(), sel:today() }; renderCal(); }}, T("Hôm nay"))));
  const grid = h("div", {class:"calgrid"}, (lang === "en" ? ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] : ["T2","T3","T4","T5","T6","T7","CN"]).map(n => h("div", {class:"dow"}, n)));
  const by = {}; tasks.forEach(t => { if (t.due) (by[t.due] = by[t.due] || []).push(t); });
  for (let i = 0; i < (new Date(y, m, 1).getDay() + 6) % 7; i++) grid.append(h("div", {class:"day blank"}));
  for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++){
    const key = y + "-" + pad(m + 1) + "-" + pad(d), ls = by[key] || [];
    grid.append(h("button", {class:"day" + (key === today() ? " today" : "") + (key === sel ? " sel" : ""), onclick(){ ui.cal.sel = key; renderCal(); }},
      h("span", {class:"dn"}, d), ls.slice(0, 3).map(t => h("span", {class:"chip" + (t.done ? " done" : "")}, t.text)),
      ls.length > 3 && h("span", {class:"more"}, "+" + (ls.length - 3)), ls.length > 0 && h("span", {class:"dot"}, "•".repeat(Math.min(ls.length, 3)))));
  }
  const dayTasks = by[sel] || [];
  out.append(grid, h("div", {class:"meta", style:"margin-top:8px"}, T("Ô thêm tác vụ phía trên sẽ dùng ngày đang chọn làm hạn chót.")),
    h("div", {class:"gt"}, new Date(sel + "T00:00").toLocaleDateString(loc, {weekday:"long", day:"numeric", month:"long"}) + " · " + dayTasks.length),
    h("div", {class: ui.mode}, dayTasks.map(taskEl)), !dayTasks.length && h("div", {class:"empty"}, T("Chưa có tác vụ nào trong ngày này.")));
}

// ---- AI: lập kế hoạch tự động + chia nhỏ công việc ----
let plan = [], aiMode = "plan", splitOf = "", splitDue = "";
const okDate = (s, past) => (/^\d{4}-\d{2}-\d{2}$/.test(s || "") && !isNaN(new Date(s))) ? (past || s >= today() ? s : today()) : "";
function openAI(mode, text = "", parentDue = null){
  aiMode = mode; splitOf = parentDue === null ? "" : text; splitDue = parentDue || "";
  warmUp(); $("#ag").value = text; $("#aout").replaceChildren(); $("#aadd").classList.add("hide"); $("#ai").classList.remove("hide"); $("#ag").focus();
}
function aiSys(endIso){
  const idx = (new Date().getDay() + 6) % 7, wd = new Date().toLocaleDateString("vi-VN", {weekday:"long"});
  const when = "Hôm nay là " + wd + ", " + today() + ". Chủ nhật tuần này là " + dayPlus(6 - idx) + ". " + (endIso ? "Kế hoạch phải xong trước hoặc đúng ngày " + endIso + ". " : "");
  const fmt = " Mỗi việc ghi trên MỘT dòng đúng định dạng: YYYY-MM-DD | tiêu đề (tối đa 10 từ). Không viết gì khác ngoài các dòng đó. Viết tiêu đề bằng " + langName() + ".";
  return aiMode === "plan"
    ? 'Bạn là trợ lý lập kế hoạch. Tách yêu cầu của người dùng thành 5-8 việc nhỏ, cụ thể, theo thứ tự thực hiện hợp lý. Ngày nằm từ hôm nay đến cuối khoảng thời gian người dùng nêu (nếu nói "tuần này" thì đến Chủ nhật, nếu không nêu thì trong 7 ngày tới), phân bổ đều các ngày, tối đa 3 việc mỗi ngày. ' + when + fmt
    : "Bạn là trợ lý chia nhỏ công việc. Chia công việc của người dùng thành 4-5 bước nhỏ, cụ thể, theo thứ tự thực hiện (ví dụ: chuẩn bị, thực hiện, kiểm thử, hoàn thiện). " + (splitDue ? "Hạn chót của công việc gốc là " + splitDue + ", mọi bước phải xong trước hoặc đúng ngày này. " : "Nếu không có hạn chót, hãy rải các bước trong 7 ngày tới. ") + when + fmt;
}
function parsePlan(text){
  const lines = text.split("\n").map(l => l.replace(/[*_`#]/g, "").trim().replace(/^((?:\d{1,2}[.)]\s*|[-•]\s*)?)(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/, (m, pre, d, mo, yy) => pre + yy + "-" + mo.padStart(2, "0") + "-" + d.padStart(2, "0")));
  const strict = lines.map(l => { const m = l.match(/^(?:\d{1,2}[.)]\s*|[-•]\s*)?(\d{4}-\d{2}-\d{2})\s*[|:–—-]\s*(.+)$/); return m ? { date:m[1], title:m[2].trim() } : null; }).filter(Boolean);
  if (strict.length) return strict.slice(0, 14);
  return lines.map(l => { const m = l.match(/^(?:\d{1,2}[.)]\s*|[-•]\s*)?(.{3,})$/); return m ? { date:"", title:m[1].trim() } : null; }).filter(Boolean).slice(0, 14);
}
$("#aibtn").onclick = () => openAI("plan");
$("#aclose").onclick = () => $("#ai").classList.add("hide");
$("#ai").onclick = e => { if (e.target.id === "ai") $("#ai").classList.add("hide"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#ai").classList.add("hide"); });
// ---- Hiểu yêu cầu về lịch ("mỗi thứ 2", "hết tháng 10", "trong 3 tuần"...): app tự tính ngày ----
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").toLowerCase();
const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function parseWhen(text){
  const s = norm(text), days = new Set(), now = new Date(), y = now.getFullYear(), t0 = new Date(today() + "T00:00");
  [[/\bthu\s*(?:2|hai)\b/, 1], [/\bthu\s*(?:3|ba)\b/, 2], [/\bthu\s*(?:4|tu)\b/, 3], [/\bthu\s*(?:5|nam)\b(?!\s*nay)/, 4], [/\bthu\s*(?:6|sau)\b/, 5], [/\bthu\s*(?:7|bay)\b/, 6], [/\bchu nhat\b/, 0],
   [/\bmonday\b/, 1], [/\btuesday\b/, 2], [/\bwednesday\b/, 3], [/\bthursday\b/, 4], [/\bfriday\b/, 5], [/\bsaturday\b/, 6], [/\bsunday\b/, 0]].forEach(([re, d]) => { if (re.test(s)) days.add(d); });
  if (/\b(?:moi|hang) ngay\b/.test(s)) [0, 1, 2, 3, 4, 5, 6].forEach(d => days.add(d));
  let end = null, m, start = t0;
  const D2 = "(\\d{1,2})[\\/\\-.](\\d{1,2})(?:[\\/\\-.](\\d{2,4}))?", rm = s.match(new RegExp(D2 + "\\s*(?:->|=>|>|-|–|—|den|toi)\\s*(?:ngay\\s*)?" + D2));
  const mk = (d, mo, yy) => new Date(yy ? (+yy < 100 ? 2000 + +yy : +yy) : y, +mo - 1, +d);
  if (rm && +rm[2] <= 12 && +rm[5] <= 12 && (/\btu\s*(?:ngay\s*)?\d/.test(s) || (rm[3] && rm[6]))){
    start = mk(rm[1], rm[2], rm[3]); end = mk(rm[4], rm[5], rm[6]);
    if (end < start && !rm[6]) end = mk(rm[4], rm[5], y + 1);
    if (!days.size) [0, 1, 2, 3, 4, 5, 6].forEach(d => days.add(d));
  }
  else if ((m = s.match(/(?:het|den(?: het)?|trong)\s*thang\s*(\d{1,2})(?:\s*nam\s*(\d{4}))?/)) && +m[1] >= 1 && +m[1] <= 12){ const yy = m[2] ? +m[2] : (+m[1] - 1 < now.getMonth() ? y + 1 : y); end = new Date(yy, +m[1], 0); }
  else if ((m = s.match(/(?:den|truoc|het)\s*(?:ngay\s*)?(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/))){ let yy = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : y; end = new Date(yy, +m[2] - 1, +m[1]); if (!m[3] && end < t0) end = new Date(yy + 1, +m[2] - 1, +m[1]); }
  else if (/het nam/.test(s)) end = new Date(y, 11, 31);
  else if ((m = s.match(/trong\s*(\d{1,2})\s*tuan/))) end = new Date(t0.getTime() + +m[1] * 7 * 864e5);
  else if ((m = s.match(/trong\s*(\d{1,2})\s*ngay/))) end = new Date(t0.getTime() + +m[1] * 864e5);
  else if (/tuan nay/.test(s)) end = new Date(t0.getTime() + (6 - (t0.getDay() + 6) % 7) * 864e5);
  else if (/thang nay/.test(s)) end = new Date(y, now.getMonth() + 1, 0);
  if (!days.size && !end) return null;
  if (days.size && !end) end = new Date(t0.getTime() + 28 * 864e5);
  const dates = [];
  if (days.size) for (let d = new Date(start); d <= end && dates.length < 62; d = new Date(d.getTime() + 864e5)) if (days.has(d.getDay())) dates.push(isoOf(d));
  return { dates, end: isoOf(end) };
}
function parseTitles(text){
  return text.split("\n").map(l => l.replace(/[*_`#]/g, "").replace(/^\s*(?:\d{1,2}[.)]\s*|[-•]\s*)/, "").replace(/^\d{4}-\d{2}-\d{2}\s*[|:–—-]\s*/, "").trim()).filter(l => l.length >= 3);
}
function subjectOf(text){   // chỉ lấy tên môn/việc theo đúng yêu cầu, bỏ phần nói về lịch
  const q = text.match(/["“”«]([^"“”«»]+)["“”»]/);   // có ngoặc kép: lấy đúng nội dung trong ngoặc
  if (q && q[1].trim()) return q[1].trim();
  let s = " " + text.normalize("NFC").trim().replace(/\s+/g, " ") + " ", n = norm(s);
  const cut = re => { for (let m; (m = re.exec(n)); ){ s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length); n = norm(s); } };
  cut(/(?:vao\s+)?(?:moi|hang|mooi)\s+(?:thu\s*(?:2|3|4|5|6|7|hai|ba|tu|nam|sau|bay)|chu nhat|ngay|tuan|thang)/);
  cut(/(?:\btu\s*)?(?:ngay\s*)?\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?\s*(?:->|=>|>|-|–|—|den|toi)\s*(?:ngay\s*)?\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?/);
  cut(/\b(?:vao\s+)?(?:thu\s*(?:2|3|4|5|6|7|hai|ba|tu|sau|bay)|thu\s*nam(?!\s*nay)|chu nhat)\b/);
  cut(/\b(?:den(?: het)?|trong|het)\s*thang\s*\d{1,2}(?:\s*nam\s*(?:nay|\d{4}))?/);
  cut(/\b(?:den|truoc|het)\s*(?:ngay\s*)?\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?/);
  cut(/\b(?:den\s+)?het nam(?: nay)?\b|\btrong\s*\d{1,2}\s*(?:tuan|ngay)\b|\b(?:trong\s+)?(?:tuan|thang) nay\b|\bnam nay\b/);
  cut(/\b(?:tao|lap|xep|len)\s+(?:lich|ke hoach)\b|\b(?:lich|ke hoach)\b/);
  cut(/\b(?:tren|o)\s+(?:truong|lop)\b|\b(?:hay|giup toi|giup minh|cho toi|toi muon|toi can|minh muon)\b/);
  s = s.replace(/[,.;:]+/g, " ").replace(/\s+/g, " ").trim(); n = norm(s);
  const mon = n.match(/(?:^|\s)mon\s+/);
  if (mon) s = s.slice(mon.index + mon[0].length);
  else s = s.replace(/^(?:học|hoc)\s+/i, "");
  s = s.replace(/(?:^|\s)(?:và|với|đến|trong|vào|trước)$/i, "").trim();
  s = s || text.trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function spreadIfFlat(rows, endIso){   // nếu mô hình trả toàn cùng một ngày thì rải đều tới hạn cuối
  if (rows.length < 2 || new Set(rows.map(r => okDate(r.date))).size > 1) return rows;
  const span = Math.max(1, Math.round((new Date((endIso || dayPlus(6)) + "T00:00") - new Date(today() + "T00:00")) / 864e5));
  return rows.map((r, i) => ({ ...r, date: dayPlus(Math.round(i * span / (rows.length - 1))) }));
}
function schedSys(n){
  return "Bạn là trợ lý lập kế hoạch. Người dùng cần một kế hoạch gồm ĐÚNG " + n + " buổi hoặc việc, sắp xếp từ cơ bản đến nâng cao, nội dung mỗi buổi cụ thể và khác nhau, nêu rõ chủ đề người dùng đã nói. Mỗi buổi ghi trên MỘT dòng, chỉ gồm tiêu đề ngắn (tối đa 10 từ), không ghi ngày, không đánh số, không viết gì khác. Viết bằng " + langName() + ".";
}
$("#aform2").onsubmit = async e => {
  e.preventDefault();
  const text = $("#ag").value.trim(), out = $("#aout"), btn = $("#agen"); if (!text) return;
  plan = []; btn.disabled = true; $("#aadd").classList.add("hide");
  const when = parseWhen(text), sched = when && when.dates.length ? when.dates : null;
  const t0 = Date.now(), status = h("div", {class:"meta"}), say = () => { status.textContent = T("Đang tạo...") + " " + Math.round((Date.now() - t0) / 1000) + "s"; };
  const dm = d => d.slice(8) + "/" + d.slice(5, 7), note = sched ? h("div", {class:"meta"}, T("Đã xếp lịch theo yêu cầu:") + " " + (sched.length > 6 ? sched.length + " " + T("ngày") + ", " + dm(sched[0]) + " → " + dm(sched[sched.length - 1]) : sched.map(dm).join(", "))) : null;
  const fromText = t => sched ? parseTitles(t).slice(0, sched.length).map((x, i) => ({ title:x, date:sched[i] })) : parsePlan(t);
  const show = rows => out.replaceChildren(...(note ? [note] : []), ...rows.map(x => h("label", {class:"aitem"}, h("input", {type:"checkbox", checked:true}),
    h("input", {type:"text", class:"at", value:x.title.slice(0, 200), "aria-label":"Tên việc"}), h("input", {type:"date", class:"adate", value:okDate(x.date, !!sched)}))), status);
  say(); out.replaceChildren(status); const tick = setInterval(say, 1000);
  try {
    const endIso = (when && when.end) || (aiMode === "split" && splitDue) || null;
    if (sched){ const name = subjectOf(text); plan = sched.map(d => ({ title:name, date:d })); }   // có lịch: chỉ ghi tên môn, không cần AI
    else {
      const full = await aiChat((aiMode === "plan" ? "Yêu cầu: " : "Công việc: ") + text, aiSys(endIso), t => {
        const lines = t.split("\n"); lines.pop();                      // bỏ dòng đang viết dở
        const rows = parsePlan(lines.join("\n")); if (rows.length !== plan.length){ plan = rows; show(rows); }
      }, 450);
      plan = parsePlan(full);
      if (!plan.length) throw new SyntaxError("empty");
      plan = spreadIfFlat(plan, endIso);
    }
    plan.sort((a, b) => (okDate(a.date) || "9").localeCompare(okDate(b.date) || "9"));
    show(plan); status.remove(); $("#aadd").classList.remove("hide");
  } catch (err) {
    out.replaceChildren(h("div", {class:"late"}, err instanceof SyntaxError ? T("AI trả về dữ liệu không hợp lệ, hãy thử lại.") : err.message));
  }
  clearInterval(tick); btn.disabled = false;
};
$("#aadd").onclick = () => {
  let first = ""; const dues = [];
  [...$("#aout").querySelectorAll(".aitem")].forEach((r, i) => {
    if (!r.querySelector("input").checked) return;
    const due = r.querySelector(".adate").value, x = plan[i];
    add((r.querySelector(".at").value.trim() || x.title).slice(0, 200), due, ((x.note || "").trim() + (splitOf ? "\n↳ " + splitOf : "")).trim().slice(0, 500));
    if (due) dues.push(due);
  });
  first = dues.filter(d => d >= today()).sort()[0] || dues.sort()[0] || "";
  $("#ai").classList.add("hide");
  if (first){ ui.view = "cal"; ui.cal = { y:+first.slice(0, 4), m:+first.slice(5, 7) - 1, sel:first }; ui.q = ""; render(); }
};
$("#asplit").onclick = () => { const title = $("#et").value.trim(); if (!title) return; const due = $("#ed").value; closeEdit(); openAI("split", title, due); };
$("#ainote").onclick = async () => {

  } catch (err) { alert(err.message); }
